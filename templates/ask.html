{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Задай вопрос</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="row">
    {% block title %}
        <div class="d-flex gap-3 align-items-center mb-2">
            <h2>Новый вопроc</h2>
        </div>
    {% endblock %}
    {% block content %}
        <form id="questionForm">
            <div class="mb-3 row align-items-center">
                <label for="exampleInputTitle" class="col-sm-2 col-form-label">
                    <h5>Название</h5>
                </label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="exampleInputTitle">
                    <div class="text-danger mt-1" id="titleError" style="display: none;">Введите название</div>
                </div>
            </div>

            <div class="mb-3 row align-items-center">
                <label for="exampleInputDescription" class="col-sm-2 col-form-label">
                    <h5>Описание</h5>
                </label>
                <div class="col-sm-8">
                    <textarea class="form-control" id="exampleInputDescription" rows="10"></textarea>
                    <div class="text-danger mt-1" id="descriptionError" style="display: none;">Введите описание</div>
                </div>
            </div>

            <div class="mb-3 row align-items-center">
                <label for="exampleInputTags" class="col-sm-2 col-form-label">
                    <h5>Тэги</h5>
                </label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="exampleInputTags">
                    <div class="text-danger mt-1" id="tagsError" style="display: none;">Введите тэги</div>
                </div>
            </div>

            <div class="mb-5 row align-items-center">
                <label class="col-sm-2 col-form-label"></label>
                <div class="col-sm-8">
                    <button type="button" class="btn btn-success" id="liveAlertBtn">
                        <div class="d-flex gap-2">
                            <img src="/static/images/check-circle.svg" alt="Check icon"/>
                            Спросить
                        </div>
                    </button>
                </div>
            </div>
        </form>
    {% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}
<script>
    document.getElementById('liveAlertBtn').addEventListener('click', function () {
        // Получаем поля и сообщения об ошибках
        const title = document.getElementById('exampleInputTitle');
        const description = document.getElementById('exampleInputDescription');
        const tags = document.getElementById('exampleInputTags');
        
        const titleError = document.getElementById('titleError');
        const descriptionError = document.getElementById('descriptionError');
        const tagsError = document.getElementById('tagsError');
        
        let isValid = true;

        // Проверка на пустоту полей и вывод предупреждений
        if (!title.value.trim()) {
            titleError.style.display = 'block';
            isValid = false;
        } else {
            titleError.style.display = 'none';
        }

        if (!description.value.trim()) {
            descriptionError.style.display = 'block';
            isValid = false;
        } else {
            descriptionError.style.display = 'none';
        }

        if (!tags.value.trim()) {
            tagsError.style.display = 'block';
            isValid = false;
        } else {
            tagsError.style.display = 'none';
        }

        // Если все поля заполнены, отправляем форму
        if (isValid) {
            document.getElementById('questionForm').submit();
        }
    });
</script>
{% endblock %}
</body>
</html>
