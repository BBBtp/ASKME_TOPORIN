{% load static %}
<div class="card w-100" style="width: 18rem;">
    <div class="card-body">
        <div class="row">
            <div class="col-2">
                <img src="{{ '/static/images/chiefKeef.jpg' }}" 
                     class="img-thumbnail rounded-circle medium-circle" alt="Avatar Image">
                <article class="mt-2">
                    <div class="panel panel-default">
                        <span class="d-flex justify-content-center">
                            <div class="me-2">
                                <img src="{% static 'images/like.png' %}" class="small like-button" style="cursor: pointer;">
                                <span class="badge text-bg-primary like-count">{{ answer.likes.count }}</span>
                            </div>
                        </span>
                    </div>
                </article>
            </div>
            <div class="col-10">
                <p class="card-text">{{ answer.text }}</p>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="flexCheckDefault_{{ answer.id }}">
                    <label class="form-check-label" for="flexCheckDefault_{{ answer.id }}">
                        Верно!
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
